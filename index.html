<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Список задач</title>
  <link rel="stylesheet" href="styles.css">
  <script src="storage.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="card">
    <header>
      <p class="eyebrow">НА КАЖДЫЙ ДЕНЬ</p>
      <h1>Список задач</h1>
      <p class="subtitle">Запишите то, что важно сделать.</p>
    </header>
    <form id="task-form" novalidate>
      <label for="task-input">Новая задача</label>
      <div class="form-row">
        <input id="task-input" type="text" placeholder="Например, купить продукты" autocomplete="off" aria-describedby="form-error">
        <button class="add-button" type="submit">Добавить</button>
      </div>
      <p id="form-error" class="form-error" role="alert" hidden></p>
    </form>
    <p id="storage-warning" class="warning" role="alert" hidden></p>
    <section class="tasks" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Мои задачи</h2>
      <p id="empty-state" class="empty">Пока задач нет. Добавьте первую!</p>
      <ul id="task-list"></ul>
    </section>
  </main>
</body>
</html>
